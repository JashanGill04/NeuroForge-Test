services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - neuroforge-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - neuroforge-network

  postgres:
    image: postgres:16
    container_name: neuroforge-postgres
    environment:
      POSTGRES_DB: neuroforge_nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neuroforge_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - neuroforge-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: neuroforge-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import
      - ./keycloak-themes:/opt/keycloak/themes/neuroforge
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 600s
    networks:
      - neuroforge-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: neuroforge-backend
    ports:
      - "9000:9000"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/neuroforge_nexus
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/neuroforge-nexus/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8080/realms/neuroforge-nexus
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-unused}
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      APP_ENCRYPTION_SECRET: ${APP_ENCRYPTION_SECRET}
      APP_ENCRYPTION_SALT: ${APP_ENCRYPTION_SALT}
      APP_PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - neuroforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - neuroforge-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - neuroforge-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    networks:
      - neuroforge-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - neuroforge-network

volumes:
  postgres_data:
  keycloak_data:
  grafana_data:

networks:
  neuroforge-network:
    driver: bridge